name: Windows packages and GHCR archive

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python with Tcl/Tk
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          architecture: x64

      - name: Read and validate version
        id: version
        run: |
          $version = python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read project version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag must match pyproject.toml version: v$version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Run source and UI tests
        run: python -m unittest discover -s tests -v

      - name: Build application and offline installer
        run: ./build-installer.ps1

      - name: Test the packaged executable
        env:
          VTGUI_TEST_EXE: ${{ github.workspace }}\dist\VTGUI\VTGUI.exe
        run: python -m unittest discover -s tests -p test_packaged.py -v

      - name: Verify installation, upgrade and uninstall
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: python installer/verify_installer.py "dist/VTGUI-$env:APP_VERSION-Setup-x64.exe"

      - name: Create portable ZIP, build metadata and checksums
        run: python installer/package_artifacts.py

      - name: Upload Windows downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VTGUI-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  archive:
    name: Archive verified Windows files in GHCR
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      APP_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download Windows files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: VTGUI-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: release

      - name: Set up ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: '1.3.1'

      - name: Verify, archive and retrieve files
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          package="ghcr.io/${GITHUB_REPOSITORY,,}"
          build_tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          package_name="${GITHUB_REPOSITORY#*/}"
          package_api="/users/$GITHUB_REPOSITORY_OWNER/packages/container/${package_name,,}"
          access_error="$(mktemp)"
          if visibility="$(gh api "$package_api" --jq .visibility 2>"$access_error")"; then
            if [[ "$visibility" != private ]]; then
              echo 'Refusing to upload Windows files to an existing non-private package' >&2
              exit 1
            fi
          elif ! grep -q 'HTTP 404' "$access_error"; then
            cat "$access_error" >&2
            exit 1
          fi
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          oras push "$package:$build_tag" \
            --image-spec v1.0 \
            --artifact-type application/vnd.vtgui.windows.bundle.v1 \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "org.opencontainers.image.version=$APP_VERSION" \
            --annotation "org.opencontainers.image.description=VTGUI Windows x64 installer and portable files" \
            "VTGUI-$APP_VERSION-Setup-x64.exe:application/vnd.microsoft.portable-executable" \
            "VTGUI-$APP_VERSION-Setup-x64.exe.sha256:text/plain" \
            "VTGUI-$APP_VERSION-Portable-x64.zip:application/zip" \
            "VTGUI-$APP_VERSION-Portable-x64.zip.sha256:text/plain" \
            "build-info.json:application/json" \
            "SHA256SUMS:text/plain"
          visibility="$(gh api "$package_api" --jq .visibility)"
          if [[ "$visibility" != private ]]; then
            echo 'Expected the GHCR archive to be private' >&2
            exit 1
          fi
          digest="$(oras resolve "$package:$build_tag")"
          verification_dir="$(mktemp -d)"
          oras pull "$package@$digest" --output "$verification_dir"
          (cd "$verification_dir" && sha256sum --check SHA256SUMS)
          oras tag "$package@$digest" "sha-$GITHUB_SHA"
          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            oras tag "$package@$digest" latest
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            oras tag "$package@$digest" "$GITHUB_REF_NAME" "$APP_VERSION"
          fi
          {
            echo '### Windows files archived in GHCR'
            echo
            echo "Reference: \`$package:$build_tag\`"
            echo
            echo "Verified digest: \`$digest\`"
            echo
            echo 'Retrieve with ORAS after logging into GHCR:'
            echo '```sh'
            echo "oras pull $package@$digest --output VTGUI-download"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish tagged version in Releases
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" ./* --verify-tag \
              --repo "$GITHUB_REPOSITORY" --title "VTGUI $APP_VERSION" --generate-notes
          fi
